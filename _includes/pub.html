{% assign p = include.p %}
<li class="pub" data-tag="{{ p.group }}">
  <p class="pub-title">{{ p.title }}</p>
  <p class="pub-meta"><span class="dot t-{{ p.group }}" aria-hidden="true"></span><span class="pub-authors">{{ p.authors | replace: "G. Wan", "<strong>G. Wan</strong>" }}</span><span class="pub-venue">{{ p.venue }}, {{ p.year }}</span>{% if p.equal %}<span>*equal contribution</span>{% endif %}{% for l in p.links %}<a href="{{ l[1] }}">{{ l[0] }}</a>{% endfor %}</p>
</li>
