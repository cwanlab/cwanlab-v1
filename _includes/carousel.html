{% assign photos = site.data.photos %}
<figure class="banner" data-carousel>
  {% for ph in photos %}
  <picture data-caption="{{ ph.caption }}"{% unless forloop.first %} hidden{% endunless %}>
    <source media="(max-width: 680px)" srcset="{{ ph.src | relative_url }}">
    <img src="{{ ph.wide | default: ph.src | relative_url }}" alt="{{ ph.alt }}"{% unless forloop.first %} loading="lazy"{% endunless %} width="1600" height="700">
  </picture>
  {% endfor %}
  <figcaption><span class="banner-cap">{{ photos.first.caption }}</span>{% if photos.size > 1 %}<span class="banner-nav"><button class="carousel-btn prev" type="button" aria-label="Previous photo">‹</button><button class="carousel-btn next" type="button" aria-label="Next photo">›</button></span>{% endif %}</figcaption>
</figure>
