{% assign photos = site.data.photos %}
<figure class="carousel" data-carousel>
  <div class="carousel-frame">
    {% for ph in photos %}
    <img src="{{ ph.src | relative_url }}" alt="{{ ph.alt }}" data-caption="{{ ph.caption }}"{% unless forloop.first %} hidden loading="lazy"{% endunless %} width="1400" height="1049">
    {% endfor %}
    {% if photos.size > 1 %}
    <button class="carousel-btn prev" type="button" aria-label="Previous photo">‹</button>
    <button class="carousel-btn next" type="button" aria-label="Next photo">›</button>
    {% endif %}
  </div>
  <figcaption>{{ photos.first.caption }}</figcaption>
  {% if photos.size > 1 %}<div class="carousel-dots">{% for ph in photos %}<span{% if forloop.first %} class="on"{% endif %}></span>{% endfor %}</div>{% endif %}
</figure>
