<header class="site-head">
  <div class="wrap bar">
    <div class="mark">
      <a class="mark-logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">{% include logo-cw.svg %}</a>
      <a class="mark-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="mark-sub">{{ site.pi.employer }}</span>
    </div>
    <nav class="nav" aria-label="Main">
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
