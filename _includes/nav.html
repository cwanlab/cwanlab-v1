<header class="site-head">
  <div class="wrap bar">
    <a class="mark-logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">{% include logo-cw.svg %}</a>
    <nav class="nav" aria-label="Main">
      <ul>
        {% for item in site.nav %}
        {% assign here = false %}{% if page.url == item.url %}{% assign here = true %}{% endif %}
        <li><a href="{{ item.url | relative_url }}"{% if here %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
      <div class="nav-icons">
        <button class="theme-toggle" type="button" aria-label="Switch light or dark theme">{% include icons/moon.svg %}{% include icons/sun.svg %}</button>
        <a href="{{ site.pi.scholar }}" aria-label="Google Scholar">{% include icons/scholar.svg %}</a>
        <a href="https://github.com/{{ site.pi.github }}" aria-label="GitHub">{% include icons/github.svg %}</a>
      </div>
    </nav>
  </div>
</header>
